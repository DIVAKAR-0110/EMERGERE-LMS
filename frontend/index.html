<!DOCTYPE html>
<html lang="en" style="margin:0;padding:0;overflow:hidden;width:100vw;height:100vh;">

<head>
  <meta charset="UTF-8" />
  <script>
    // Suppress third-party browser extension / web-vitals reportAllChanges console errors
    window.addEventListener('error', function (event) {
      if (
        event.message && (
          event.message.includes("Cannot read properties of undefined (reading 'startTime')") ||
          event.message.includes("reportAllChanges")
        )
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return true;
      }
    }, true);

    const _origConsoleError = console.error;
    console.error = function (...args) {
      const msg = args.map(a => (a && a.stack) ? a.stack : String(a)).join(' ');
      if (msg.includes("Cannot read properties of undefined (reading 'startTime')") || msg.includes('reportAllChanges')) {
        return;
      }
      _origConsoleError.apply(console, args);
    };
  </script>

  <link rel="icon" type="image/png" sizes="512x512" href="/emergere_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <title>LMS - Career Growth</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html,
    body,
    #root {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
  </style>
</head>

<body style="margin:0;padding:0;overflow:hidden;width:100vw;height:100vh;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
