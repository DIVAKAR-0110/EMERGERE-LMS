services:
  # FastAPI Backend API
  - type: web
    name: emergere-lms-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_TENANT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OUTLOOK_CLIENT_ID
        sync: false
      - key: OUTLOOK_CLIENT_SECRET
        sync: false
      - key: OUTLOOK_REDIRECT_URI
        sync: false
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        value: LMS
      - key: DB_DRIVER
        value: ODBC Driver 17 for SQL Server
      - key: DB_TRUSTED_CONNECTION
        value: "no"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ENABLE_DEV_MOCK_AUTH
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false

  # Vite + React Frontend (Static Site)
  - type: web
    name: emergere-lms-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
